<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>後台預覽｜主頁照片</title>
  <link rel="stylesheet" href="../../../css/admin.css">
  <link rel="stylesheet" href="../../../css/brand.css">
</head>
<body>
<div class="dashboard">
  <aside>
    <a class="brand" href="#"><img class="brand-logo" src="../../../assets/images/logo-cropped.png" alt="賞心學堂 Ink House"></a>
    <nav>
      <button>⌂　總覽</button>
      <button>◫　課程管理</button>
      <button class="active">▣　主頁照片</button>
      <button>♙　報名名單</button>
    </nav>
    <button class="logout">↪　登出</button>
  </aside>
  <main>
    <header><div><p>ART STUDIO</p><h1>主頁照片</h1></div></header>
    <section>
      <div class="panel">
        <div class="panel-head"><h2>輪播照片</h2><button class="add-button">＋ 新增輪播照片</button></div>
        <div class="photo-grid">
          <div class="photo-card">
            <img src="../../../assets/images/instagram-pet-course.jpg" alt="">
            <div class="actions"><button disabled>上移</button><button>下移</button><button class="delete">刪除</button></div>
          </div>
          <div class="photo-card">
            <div class="photo-empty">第二張輪播</div>
            <div class="actions"><button>上移</button><button>下移</button><button class="delete">刪除</button></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>歡迎區塊照片</h2></div>
        <div class="about-slots">
          <div>
            <p class="slot-label">大圖 · 學堂空間</p>
            <div class="photo-card">
              <div class="photo-empty">尚未上傳</div>
              <div class="actions"><button>上傳照片</button></div>
            </div>
          </div>
          <div>
            <p class="slot-label">小圖 · 創作過程</p>
            <div class="photo-card">
              <div class="photo-empty">尚未上傳</div>
              <div class="actions"><button>上傳照片</button></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
