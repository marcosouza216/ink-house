<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>課程報名｜賞心學堂</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="site-header page-header">
    <a class="brand" href="index.html"><b>ink</b><span>house</span><small>賞心學堂</small></a>
    <button class="menu-button" aria-label="開啟選單"><i></i><i></i></button>
    <nav><a href="index.html">主頁</a><a href="courses.html">藝術課程</a><a href="schedule.html">時間表</a><a class="nav-cta" href="signup.html">立即報名</a></nav>
  </header>
  <main>
    <section class="page-hero">
      <p class="kicker">COURSE REGISTRATION</p><h1>課程報名</h1>
      <p>可同時選擇多項感興趣的課程。送出後請加入中心微信完成付款及確認。</p>
    </section>
    <section class="page-content registration-layout">
      <div>
        <p class="kicker">YOUR SELECTION</p>
        <h2 class="registration-heading">選擇喜歡的課程，<br>開始你的創作旅程。</h2>
        <div class="selected-course" id="selectedCourse">尚未選擇課程</div>
      </div>
      <form class="registration-form" id="registrationForm">
        <fieldset class="course-choice-fieldset">
          <legend>報名課程（可多選）</legend>
          <div class="course-checkboxes" id="courseOptions"></div>
        </fieldset>
        <div class="form-row">
          <label>名稱<input name="name" required autocomplete="name"></label>
          <label>年齡<input name="age" required inputmode="numeric"></label>
        </div>
        <div class="form-row">
          <label>電話<input name="phone" required inputmode="tel" placeholder="+853"></label>
          <label>微信<input name="wechat" required autocomplete="off"></label>
        </div>
        <label>如果現有時間不合，請選擇喜歡的時間段
          <select name="preferredTime">
            <option value="">現有課堂時間可以</option>
            <option>平日上午</option><option>平日下午</option><option>平日晚上</option>
            <option>星期六上午</option><option>星期六下午</option>
            <option>星期日上午</option><option>星期日下午</option>
          </select>
        </label>
        <label class="consent"><input type="checkbox" required><span>我同意中心使用上述資料作課程聯絡及付款確認用途。</span></label>
        <button class="button dark" type="submit">送出報名 →</button>
        <p id="formStatus" role="status"></p>
      </form>
      <section class="registration-success" id="registrationSuccess" hidden>
        <p class="kicker">REGISTRATION RECEIVED</p><h2>報名成功！</h2>
        <p>請掃描下方 QR Code 加入中心微信，並透過微信與我們確認課程及進行付款。</p>
        <div class="wechat-qr-wrap">
          <img src="assets/wechat-qr.png" alt="賞心學堂中心微信 QR Code" id="wechatQr">
          <div class="qr-placeholder" id="qrPlaceholder">中心微信 QR Code</div>
        </div>
        <strong>微信：inkhouse_macao</strong>
        <a class="button coral" href="courses.html">繼續查看課程 →</a>
      </section>
    </section>
  </main>
  <script src="js/data.js"></script><script src="js/site.js"></script>
</body>
</html>
