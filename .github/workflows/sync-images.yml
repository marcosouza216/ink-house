name: Sync course images

on:
  repository_dispatch:
    types: [sync-images]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: sync-course-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download images from Supabase
        run: python3 scripts/sync-course-images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/images/uploads
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Sync course images from Supabase"
          git pull --rebase origin main
          git push
